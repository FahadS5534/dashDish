spring:
  profiles:
    active: dev
  datasource:
    url: jdbc:postgresql://localhost:5432/food_delivery
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: localhost
      port: 6379

app:
  jwt:
    secret: your-256-bit-secret-key-here-make-it-long-enough-for-security-rules-12345
    expiration: 86400000 # 24 hours in milliseconds
