services:
  # -------------------------------------------------------------
  # 1. DashDish Spring Boot API Service
  # -------------------------------------------------------------
  - type: web
    name: dashdish-backend-api
    runtime: docker
    dockerfilePath: Dockerfile
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: PORT
        value: 8080
      - key: APP_JWT_SECRET
        generateValue: true
      - key: APP_JWT_EXPIRATION
        value: 86400000
      - key: SPRING_DATASOURCE_URL
        value: jdbc:postgresql://aws-0-eu-west-1.pooler.supabase.com:5432/postgres?sslmode=require
      - key: SPRING_DATASOURCE_USERNAME
        value: postgres.laxzahdlctlesjzltwdc
      - key: SPRING_DATASOURCE_PASSWORD
        value: X2qouCicVYWb1DL3
      - key: GEMINI_API_KEY
        sync: false

  # -------------------------------------------------------------
  # 2. DashDish Angular Frontend (Static Site with SPA Routing)
  # -------------------------------------------------------------
  - type: web
    name: dashdish-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist/frontend/browser
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
